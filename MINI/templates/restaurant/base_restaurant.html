<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodWise Restaurant</title>

<!-- Fonts and Icons -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
  :root {
    --side-bg: #ffffff;           
    --side-border: #f1f5f9;
    --side-accent: #10b981;       /* Vibrant Emerald Green */
    --side-text-main: #1e293b;    /* Deep Slate */
    --side-text-muted: #64748b;   
    --side-w: 280px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --bg-main: #f4f6f4;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-main);
    color: var(--side-text-main);
    margin: 0;
  }

  /* ── Sidebar Container ── */
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: var(--side-w);
    height: 100vh;
    background: var(--side-bg);
    display: flex;
    flex-direction: column;
    z-index: 1000;
    padding: 32px 20px;
    border-right: 2px solid var(--side-border);
    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.02);
  }

  /* ── Brand Section ── */
  .sidebar-brand {
    padding: 0 8px 30px;
    margin-bottom: 10px;
  }

  .brand-wrapper {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
  }

  .brand-logo-sq {
    width: 48px;
    height: 48px;
    background: var(--side-accent);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 26px;
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.25);
  }

  .brand-text-content h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--side-text-main);
    margin: 0;
    letter-spacing: -0.5px;
  }

  .brand-status {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--side-accent);
    display: block;
  }

  /* ── Navigation ── */
  .nav-label {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--side-text-muted);
    padding: 24px 12px 10px;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
  }

  .nav-link-custom {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 18px;
    color: var(--side-text-main);
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    border-radius: 14px;
    margin-bottom: 4px;
    transition: var(--transition);
  }

  .nav-link-custom i {
    font-size: 20px;
    color: var(--side-text-muted);
    transition: var(--transition);
  }

  .nav-link-custom:hover {
    background: #f8fafc;
    color: var(--side-accent);
  }

  /* Active State Logic */
  .nav-link-custom.active {
    background: var(--side-accent);
    color: #ffffff;
    box-shadow: 0 8px 15px rgba(16, 185, 129, 0.2);
  }

  .nav-link-custom.active i {
    color: #ffffff;
  }

  /* ── Footer / Logout ── */
  .sidebar-footer {
    background: #f8fafc;
    border: 1px solid var(--side-border);
    border-radius: 20px;
    padding: 18px;
    margin-top: 20px;
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 2px solid #fff;
  }

  .user-details p {
    margin: 0;
    font-size: 14px;
    font-weight: 800;
    color: var(--side-text-main);
  }

  .user-details span {
    font-size: 11px;
    color: var(--side-text-muted);
  }

  .logout-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px;
    background: #fee2e2;
    color: #dc2626;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    transition: var(--transition);
    text-decoration: none;
  }

  .logout-btn:hover {
    background: #dc2626;
    color: #ffffff;
  }

  /* ── Main Content Area ── */
  .main-content {
    margin-left: var(--side-w);
    min-height: 100vh;
    padding: 40px;
  }
</style>
</head>
<body>

<aside class="sidebar">
  <!-- Brand Logo -->
  <div class="sidebar-brand">
    <a href="{% url 'dashboard' %}" class="brand-wrapper">
      <div class="brand-logo-sq">
        <i class="bi bi-shield-check"></i>
      </div>
      <div class="brand-text-content">
        <span class="brand-status">Intelligence</span>
        <h2>FoodWise</h2>
      </div>
    </a>
  </div>

  <!-- Navigation -->
  <div class="sidebar-nav">
    <div class="nav-label">Management</div>
    
    <a href="{% url 'dashboard' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
      <i class="bi bi-grid-fill"></i>
      <span>Dashboard</span>
    </a>
    
    <a href="{% url 'prediction' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'prediction' %}active{% endif %}">
      <i class="bi bi-graph-up-arrow"></i>
      <span>Forecast</span>
    </a>
    
    <a href="{% url 'production' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'production' %}active{% endif %}">
      <i class="bi bi-lightning-charge-fill"></i>
      <span>Production</span>
    </a>
    
    <a href="{% url 'donations' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'donations' %}active{% endif %}">
      <i class="bi bi-heart-fill"></i>
      <span>Donations</span>
    </a>

    <div class="nav-label">Tools</div>
    
    <a href="{% url 'simulator' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'simulator' %}active{% endif %}">
      <i class="bi bi-cpu-fill"></i>
      <span>AI Simulator</span>
    </a>
    
    <a href="{% url 'map' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'map' %}active{% endif %}">
      <i class="bi bi-geo-alt-fill"></i>
      <span>Map View</span>
    </a>
    
    <a href="{% url 'analytics' %}" class="nav-link-custom {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">
      <i class="bi bi-bar-chart-steps"></i>
      <span>Analytics</span>
    </a>
  </div>

  <!-- User Action Block -->
  <div class="sidebar-footer">
    <div class="user-info">
      <img src="https://ui-avatars.com/api/?name=Green+Bistro&background=10b981&color=fff" class="user-avatar" alt="User">
      <div class="user-details">
        <p>Green Bistro</p>
        <span>Premium Access</span>
      </div>
    </div>
    <a href="{% url 'logout' %}" class="logout-btn">
      <i class="bi bi-box-arrow-left"></i>
      <span>SIGN OUT</span>
    </a>
  </div>
</aside>

<!-- Main content -->
<main class="main-content">
  {% block content %}{% endblock %}
</main>

</body>
</html>
